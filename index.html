<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Okuma Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: a painted reading nook — a watercolour sky-and-hills header (night sky in dark mode), a dotted journal page, wooden shelves with plants and trinkets between topics, covers and postage stamps. */
:root{
  --paper:#F6EFE2; --sheet:#FFFAF1; --ink:#3D2F28; --ink-2:#7B695C; --line:#E3D5BF; --dot:#DDCDB4;
  --accent:#4E7A58; --accent-ink:#FFFAF1; --accent-soft:#E3ECD8;
  --wood:#BC8A58; --wood-2:#8B5B35; --wood-3:#D4A877; --postmark:#B5533C; --gold:#D6A13F; --on-pastel:#3A2C24;
  --sky-1:#A6D0EA; --sky-2:#EAF3EC; --cloud:#FFFFFF; --hill-1:#B4CF9F; --hill-2:#88AE77; --hill-3:#5F8A57; --star-op:0; --glow:#F4D27C;
  --wash-1:rgba(167,199,150,.28); --wash-2:rgba(166,208,234,.26); --wash-3:rgba(236,190,150,.22);
  --shadow:0 1px 2px rgba(80,55,35,.10),0 8px 22px rgba(80,55,35,.10);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1A2030; --sheet:#232A3C; --ink:#F2E7D3; --ink-2:#B6AA96; --line:#363E54; --dot:#2D3548;
  --accent:#A9D09C; --accent-ink:#18211C; --accent-soft:#2A3A33;
  --wood:#80583A; --wood-2:#573922; --wood-3:#9A6E48; --postmark:#E58C70; --gold:#EBC56A;
  --sky-1:#0E1834; --sky-2:#2F3A5E; --cloud:#3B4670; --hill-1:#2F4B45; --hill-2:#243F38; --hill-3:#1A302A; --star-op:1; --glow:#F6C863;
  --wash-1:rgba(120,160,130,.10); --wash-2:rgba(110,130,200,.12); --wash-3:rgba(240,190,110,.07);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1A2030; --sheet:#232A3C; --ink:#F2E7D3; --ink-2:#B6AA96; --line:#363E54; --dot:#2D3548;
  --accent:#A9D09C; --accent-ink:#18211C; --accent-soft:#2A3A33;
  --wood:#80583A; --wood-2:#573922; --wood-3:#9A6E48; --postmark:#E58C70; --gold:#EBC56A;
  --sky-1:#0E1834; --sky-2:#2F3A5E; --cloud:#3B4670; --hill-1:#2F4B45; --hill-2:#243F38; --hill-3:#1A302A; --star-op:1; --glow:#F6C863;
  --wash-1:rgba(120,160,130,.10); --wash-2:rgba(110,130,200,.12); --wash-3:rgba(240,190,110,.07);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 60% 40% at 8% 18%,var(--wash-1),transparent 70%),radial-gradient(ellipse 50% 35% at 95% 40%,var(--wash-2),transparent 70%),radial-gradient(ellipse 55% 40% at 30% 95%,var(--wash-3),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1.3px) 0 0/18px 18px,var(--paper);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
/* painted header scene */
.top{position:relative;overflow:hidden;background:linear-gradient(to bottom,var(--sky-1),var(--sky-2) 85%)}
.scene{position:absolute;inset:0;pointer-events:none}
.scene svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.scene .stars{opacity:var(--star-op)}
.top .wrap{position:relative}
.top-in{padding-block:22px 54px!important}
.brand h1{font-family:var(--f-hand)!important;font-weight:700!important;font-size:2.4rem!important;line-height:.9!important}
.brand svg{color:var(--ink)!important}
.sub{color:var(--ink)!important;opacity:.75}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;color:var(--accent);flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.1}
.sub{margin:2px 0 0;font-size:.78rem;color:var(--ink-2)}
.top-actions{display:flex;align-items:center;gap:10px}
.yearsel{display:flex;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:2px}
.yearsel button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:1.1rem;color:var(--ink-2)}
.yearsel button:hover{background:var(--accent-soft);color:var(--ink)}
.yearsel span{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.2em;text-align:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--postmark)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab svg{width:19px;height:19px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
main{padding-block:22px 60px}

/* section headings */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hand{font-family:var(--f-hand);font-weight:700;font-size:2.4rem;line-height:1;color:var(--ink)}
.hand small{font-family:var(--f-body);font-size:.85rem;font-weight:500;color:var(--ink-2);margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.banner{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.banner b{font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--ink-2);background:var(--sheet)}
.muted{color:var(--ink-2)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px}

/* covers */
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:var(--shadow);background:var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{background:linear-gradient(90deg,rgba(0,0,0,.12),transparent 8%),var(--c);color:var(--cink,var(--on-pastel));box-shadow:var(--shadow),inset 0 0 0 1px rgba(60,40,25,.10);display:flex;flex-direction:column;justify-content:space-between;padding:12% 10% 10%;container-type:inline-size}
.cover.gen::before{content:"";position:absolute;left:5%;top:0;bottom:0;width:2px;background:rgba(0,0,0,.08)}
.cv-band{position:absolute;left:0;right:0;top:58%;height:7%;background:rgba(255,255,255,.45)}
.cv-title{font-family:var(--f-display);font-size:clamp(10px,15cqi,22px);line-height:1.1;position:relative;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cv-author{font-size:clamp(8px,9cqi,13px);font-weight:600;letter-spacing:.04em;text-transform:uppercase;position:relative;opacity:.8}
.stars{--r:0;display:inline-block;letter-spacing:1px;font-size:.95rem;line-height:1;background:linear-gradient(90deg,var(--gold) calc(var(--r) / 5 * 100%),var(--line) 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.month{margin-bottom:26px}
.month-h{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-bottom:14px}
.month-h h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem;text-transform:uppercase;letter-spacing:.08em}
.month-h span{font-family:var(--f-hand);font-size:1.25rem;color:var(--ink-2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 14px}
.citem{border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.citem .cover{transition:transform .15s}
.citem:hover .cover{transform:translateY(-3px) rotate(-1deg)}
.citem .t{font-size:.78rem;color:var(--ink-2);line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt-dot{display:inline-flex;vertical-align:-3px;color:var(--ink-2)}
.fmt-dot svg{width:15px;height:15px}
.reading-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;margin-bottom:26px}
.reading-row .citem{width:96px;flex:none}
.ribbon{position:absolute;right:12%;top:-2px;width:12px;height:26px;background:var(--postmark);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);z-index:2}

/* shelf */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:18px;border-radius:2px;vertical-align:-4px;margin-right:5px}
.shelf{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;padding:18px 16px 0;border:10px solid var(--wood-2);border-bottom-width:0;border-radius:14px 14px 4px 4px;
  background:repeating-linear-gradient(to bottom,transparent 0 176px,var(--wood-3) 176px 178px,var(--wood) 178px 187px,var(--wood-2) 187px 190px) 0 18px,
  linear-gradient(to bottom,color-mix(in srgb,var(--wood) 22%,var(--paper)),color-mix(in srgb,var(--wood) 12%,var(--paper)));
  box-shadow:var(--shadow),inset 0 10px 18px -12px rgba(60,35,15,.35)}
.ivy{position:absolute;top:-14px;width:130px;height:170px;pointer-events:none;z-index:3}
.ivy-l{left:-14px}.ivy-r{right:-14px;transform:scaleX(-1)}
.slot{height:190px;padding-bottom:14px;display:flex;align-items:flex-end;position:relative;z-index:1}
.spine{border:0;padding:8px 0;margin-right:2px;border-radius:3px 3px 1px 1px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s;color:var(--cink,var(--on-pastel));
  background:linear-gradient(to top,transparent 12px,rgba(70,45,25,.28) 12px 14px,transparent 14px),linear-gradient(90deg,rgba(60,35,20,.16),rgba(255,255,255,.18) 18%,transparent 42%,transparent 76%,rgba(60,35,20,.16)),var(--c);
  box-shadow:0 1px 0 rgba(60,35,20,.2)}
.spine:hover{transform:translateY(-6px)}
.spine .st{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-hand);font-weight:700;font-size:16px;line-height:1;max-height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine::after{content:"";position:absolute;left:3px;right:3px;top:9px;height:2px;background:rgba(0,0,0,.14);border-radius:1px}
.spine.unread{background:var(--sheet);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.spine.unread::after{background:var(--line)}
.spine.reading::before{content:"";position:absolute;bottom:-8px;left:50%;width:6px;height:16px;margin-left:-3px;background:var(--postmark);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.bookend{display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:84px;height:100%;margin:0 8px;padding-top:6px}
.slot:first-child .bookend{margin-left:0}
.tag{position:relative;font-family:var(--f-hand);font-weight:700;font-size:1.08rem;line-height:1;text-align:center;color:var(--ink);background:var(--sheet);padding:6px 8px 5px;border-radius:3px 3px 10px 10px;box-shadow:var(--shadow);transform:rotate(-4deg);max-width:84px;overflow-wrap:anywhere;border:1px solid var(--line)}
.tag::before{content:"";position:absolute;left:50%;top:-6px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--wood-2);box-shadow:0 0 0 2px var(--sheet)}
.bookend .dec{width:62px;height:82px;flex:none}
.shelf-stats{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px;font-size:.88rem;color:var(--ink-2)}
.shelf-stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* reviews */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:16px}
.rcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:96px 1fr;gap:16px;text-align:left;width:100%;min-width:0}
.rcard:hover{border-color:var(--ink-2)}
.rlabel{display:inline-block;background:var(--ink);color:var(--paper);font-size:.68rem;letter-spacing:.14em;font-weight:700;padding:3px 8px;border-radius:3px;margin-bottom:8px}
.rcard h3{font-family:var(--f-display);font-weight:400;font-size:1.08rem;line-height:1.2}
.rmeta{font-size:.82rem;color:var(--ink-2);margin:3px 0 6px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.rtext{font-family:var(--f-hand);font-size:1.3rem;line-height:1.2;margin:8px 0 0;overflow-wrap:anywhere;border-top:1px dashed var(--line);padding-top:8px}
.rtext.none{color:var(--ink-2);font-size:1.1rem}

/* TBR */
.tbr-add{display:flex;gap:8px;margin-bottom:18px}
.tbr-add input{flex:1;min-width:0}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.trow{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--c) 55%,var(--sheet));border-radius:4px;padding:6px 8px 6px 10px;min-width:0}
.trow .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);flex:none;padding:0}
.trow .chk:hover{background:var(--gold)}
.trow .tt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;font-family:var(--f-hand);font-size:1.35rem;line-height:1.1;color:var(--ink)}
.trow .tt small{font-family:var(--f-body);font-size:.75rem;color:var(--ink-2);margin-left:6px}
.trow .mini{border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);background:var(--sheet);border-radius:999px;font-size:.75rem;font-weight:600;padding:3px 9px;white-space:nowrap}
.tsec{margin-top:28px}
.tsec h3{font-family:var(--f-display);font-weight:400;font-size:1.1rem;margin-bottom:10px}

/* challenge + stamps */
.ch{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:26px}
.goal-num{font-family:var(--f-display);font-size:2.8rem;line-height:1}
.goal-num small{font-size:1.1rem;color:var(--ink-2)}
.bar{height:14px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--line);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,var(--sheet)) 8px 16px);border-radius:999px}
.pace{font-weight:600}
.pace.ok{color:#2E8B57}.pace.behind{color:var(--postmark)}
.goal-edit{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem;color:var(--ink-2)}
.goal-edit input{width:72px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.stat .v{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fmts{display:flex;gap:12px;font-variant-numeric:tabular-nums}
.fmts span{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.fmts svg{width:17px;height:17px;color:var(--ink-2)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.stamp{--c:#E8A5B0;position:relative;padding:6px;background:var(--sheet);border:0;text-align:center;
  -webkit-mask:radial-gradient(circle 3.2px,#0000 96%,#000) -4px -4px/8px 8px round,linear-gradient(#000 0 0) content-box;
  mask:radial-gradient(circle 3.2px,#0000 96%,#000) -4px -4px/8px 8px round,linear-gradient(#000 0 0) content-box;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.stamp-in{background:var(--c);color:var(--on-pastel);height:100%;min-height:150px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;outline:1.5px solid rgba(31,36,51,.35);outline-offset:-5px}
.stamp-in svg{width:38px;height:38px;margin:4px 0 2px}
.stamp .nm{font-family:var(--f-display);font-size:.92rem;line-height:1.1}
.stamp .ds{font-size:.7rem;line-height:1.25;opacity:.85}
.stamp .pr{font-size:.7rem;font-weight:700;margin-top:auto;font-variant-numeric:tabular-nums}
.stamp.locked .stamp-in{background:var(--paper);color:var(--ink-2);outline-color:var(--line)}
.stamp.locked svg{opacity:.45}
.pm{position:absolute;right:2px;top:4px;width:54px;height:54px;border:2px solid var(--postmark);border-radius:50%;color:var(--postmark);font-size:.55rem;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;transform:rotate(-16deg);opacity:.85;background:repeating-linear-gradient(0deg,transparent 0 7px,color-mix(in srgb,var(--postmark) 25%,transparent) 7px 8px)}
.mstamp .stamp-in{min-height:118px}
.mstamp .mn{font-family:var(--f-hand);font-weight:700;font-size:1.9rem;line-height:1;margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 14px}
.sec-h h3{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.sec-h span{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* bingo */
.bingo-wrap{max-width:620px}
.bgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px solid var(--ink);background:var(--sheet)}
.bcell{aspect-ratio:1;border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:none;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-hand);font-size:clamp(.82rem,2.6vw,1.12rem);line-height:1.05;text-transform:uppercase;position:relative;overflow:hidden;min-width:0}
.bcell:nth-child(5n){border-right:0}
.bcell:nth-child(n+21){border-bottom:0}
.bcell:hover{background:var(--accent-soft)}
.bcell.done{background:color-mix(in srgb,var(--c) 38%,var(--sheet));color:var(--ink)}
.bcell.free{background:var(--ink);color:var(--paper);font-size:clamp(1rem,3.4vw,1.5rem)}
.bcell .bk{font-family:var(--f-body);text-transform:none;font-size:clamp(.55rem,1.6vw,.7rem);font-weight:600;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell.line::after{content:"";position:absolute;inset:3px;border:2px solid var(--postmark);border-radius:50%;opacity:.55;transform:rotate(-8deg)}
.bingo-title{font-family:var(--f-hand);font-weight:700;font-size:3rem;line-height:1;text-align:center;margin-bottom:10px}
.bingo-title span{color:var(--postmark)}
.bstat{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0 0;font-size:.9rem;color:var(--ink-2)}

/* sheet (editor) */

/* ---------- storage: JSON files in the GitHub repo ----------

   Everyone reads; a device that holds the repo key writes, and only into the library of the person chosen as "me" on it. */
const REPO={owner:'Koloboros',repo:'ReadingJournal',branch:'main'};
const API=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/`;
const K={token:'rj-token',me:'rj-me',viewing:'rj-viewing'};
/* opened from this computer for testing: read the files next to the page and only log commits */
const LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const b64enc=s=>{const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const GH={
  token:()=>ls.get(K.token),
  headers(){const h={Accept:'application/vnd.github+json'};const t=this.token();if(t)h.Authorization='Bearer '+t;return h},
  /* {data, sha} · null when the file does not exist yet */
  async get(path){
    if(LOCAL){const r=await fetch(path+'?_='+Date.now(),{cache:'no-store'});return r.ok?{data:await r.json(),sha:'local'}:null}
    try{
      const r=await fetch(API+path+'?ref='+REPO.branch+'&_='+Date.now(),{headers:this.headers(),cache:'no-store'});
      if(r.status===404)return null;
      if(!r.ok)throw Object.assign(new Error('http '+r.status),{status:r.status});
      const j=await r.json();
      const txt=j.content?b64dec(j.content):await (await fetch(j.download_url+'?_='+Date.now(),{cache:'no-store'})).text();
      return{data:JSON.parse(txt),sha:j.sha};
    }catch(e){
      /* API unreachable or over its hourly limit: read the copy GitHub Pages serves (may be a minute behind) */
      try{const r=await fetch(path+'?_='+Date.now(),{cache:'no-store'});if(r.ok)return{data:await r.json(),sha:null};if(r.status===404)return null}catch{}
      throw e;
    }
  },
  async put(path,data,sha,message){
    if(LOCAL){console.info('[yerel deneme] commit:',message,path,data);return 'local'}
    const body=JSON.stringify({message,content:b64enc(JSON.stringify(data,null,1)),branch:REPO.branch,...(sha?{sha}:{})});
    const r=await fetch(API+path,{method:'PUT',headers:{...this.headers(),'Content-Type':'application/json'},body,keepalive:body.length<60000});
    if(!r.ok)throw Object.assign(new Error('http '+r.status),{status:r.status});
    return (await r.json()).content.sha;
  },
  async check(token){
    const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token}});
    if(!r.ok)return false;const j=await r.json();return !!j.permissions?.push;
  }
};

  },
  async saveBook(b){

    const data={books:S.books.map(cleanBook),settings:S.settings};
    try{
      if(!this.sha[id]){const f=await GH.get(path).catch(()=>null);this.sha[id]=f?.sha||null}
      try{this.sha[id]=await GH.put(path,data,this.sha[id],message)}
      catch(e){if(e.status!==409&&e.status!==422)throw e;const f=await GH.get(path);this.sha[id]=await GH.put(path,data,f?.sha,message)}

    }catch(e){
      this.msgs.unshift(...msgs);S.save='error';
      if(e.status===401||e.status===403)toast('Kaydedilemedi: anahtar geçersiz ya da süresi dolmuş. Kurulum ekranından yeni anahtar gir.');
      else{toast('Kaydedilemedi; internet bağlantını kontrol et. Biraz sonra yeniden denenecek.');this.timer=setTimeout(()=>this.flush(),15000)}
    }finally{this.flushing=false;setSync();if(this.again){this.again=false;this.flush()}}
  },
  async addPerson(name){
    if(!GH.token())return openSetup();
    name=name.trim();if(!name)return;
    let id=slug(name),n=2;while(S.people.some(p=>p.id===id))id=slug(name)+'-'+n++;
    const person={id,name,color:PCOLS[S.people.length%PCOLS.length]};
    try{
      const f=await GH.get('data/kisiler.json');const list=f?.data?.kisiler||[];list.push(person);
      this.sha.people=await GH.put('data/kisiler.json',{kisiler:list},f?.sha,`Yeni kişi: ${name}`);
      this.sha[id]=await GH.put(this.path(id),{books:[],settings:normSettings()},null,`${name} için boş kitaplık`);
      S.people=list;return person;
    }catch(e){toast(e.status===401||e.status===403?'Anahtar geçersiz; kurulumu kontrol et.':'Kişi eklenemedi; tekrar dene.')}
  }
};

function normSettings(s){return{goals:{...(s?.goals||{})},bingo:{...(s?.bingo||{})}}}

function setSync(){

/* ---------- phone / desktop view ----------
   auto: phone layout on touch phones or narrow windows; a choice from the header toggle is remembered on this device. */
const VIEW_KEY='okuma-defteri-view';
const viewPref=()=>{try{return localStorage.getItem(VIEW_KEY)||'auto'}catch{return'auto'}};
const isPhone=()=>matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=820;
function setViewport(content){let m=document.querySelector('meta[name="viewport"]');if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m)}if(m.content!==content)m.content=content}
function applyView(){
  const pref=viewPref(),phone=isPhone(),root=document.documentElement;
  if(phone)setViewport(pref==='desktop'?'width=1100':'width=device-width,initial-scale=1,viewport-fit=cover');
  const mode=pref!=='auto'?pref:(phone||innerWidth<=720?'mobile':'desktop');
  root.dataset.view=mode;
  root.toggleAttribute('data-narrow',mode==='mobile'&&!phone&&innerWidth>720);
  const devW=Math.min(screen.width,screen.height,innerWidth);
  const clamp=mode==='mobile'&&phone&&innerWidth>devW+40;
  root.toggleAttribute('data-clamp',clamp);if(clamp)root.style.setProperty('--phone-w',devW+'px');
  const vs=$('#viewsel');if(vs)vs.innerHTML=[['mobile','phone','Telefon görünümü'],['desktop','desktop','Masaüstü görünümü']].map(([v,i,l])=>`<button data-act="view" data-v="${v}" aria-pressed="${mode===v}" title="${l}" aria-label="${l}">${ico(i)}</button>`).join('');
}
addEventListener('resize',()=>{if(viewPref()==='auto'){const was=document.documentElement.dataset.view;applyView();if(was!==document.documentElement.dataset.view)render()}});

/* shelf order: topic cluster, (subject for non-fiction), author surname, series and its number, year, title */
const TOPICS=[
  [/fantast|bilim ?kurgu|distopya|macera|masal/,'Fantastik & bilim kurgu'],
  [/çizgi|grafik|resimli|manga/,'Çizgi roman & resimli'],
  [/polisiye|gerilim|suç|korku|thriller/,'Gerilim & polisiye'],
  [/roman|öykü|hikâye|hikaye|klasik|edebiyat|şiir|novella/,'Edebiyat'],
  [/ebeveyn|çocuk|beslenme|sağlık|yemek|psikoloji|terapi|kişisel|gelişim|felsefe|deneme|kurgu dışı|bilim|tarih|biyografi|anı|mitoloji|iş|ekonomi/,'Kurgu dışı']
];
function topicOf(b){const g=(b.genre||'').toLocaleLowerCase('tr');if(!g)return[9,'Diğer'];const i=TOPICS.findIndex(t=>t[0].test(g));return i<0?[8,'Diğer']:[i,TOPICS[i][1]]}
const surname=a=>{const p=String(a||'').trim().split(/\s+/);return(p[p.length-1]||'').toLocaleLowerCase('tr')};
const cmp=(x,y)=>String(x??'').localeCompare(String(y??''),'tr');
function shelfOrder(a,b){
  const ta=topicOf(a),tb=topicOf(b);if(ta[0]!==tb[0])return ta[0]-tb[0];
  if(ta[0]===4){const g=cmp((a.genre||'').toLocaleLowerCase('tr'),(b.genre||'').toLocaleLowerCase('tr'));if(g)return g}
  return cmp(surname(a.author),surname(b.author))||cmp(a.author,b.author)||cmp(a.series,b.series)
    ||((+a.seriesNo||0)-(+b.seriesNo||0))||((+a.year||0)-(+b.year||0))||cmp(a.title,b.title);
}

function vShelf(){
  const all=BOOKS().filter(b=>b.owned||b.status!=='want');

  let list=all.filter(b=>f==='all'||(f==='read'&&b.status==='read')||(f==='unread'&&b.status!=='read')||(f==='owned'&&b.owned)).sort(shelfOrder);
  const readN=all.filter(b=>b.status==='read').length, ownN=all.filter(b=>b.owned).length, waitN=all.filter(b=>b.owned&&b.status!=='read').length;
  const chip=(k,l)=>`<button class="chip" data-act="shelf-f" data-f="${k}" aria-pressed="${f===k}">${l}</button>`;
  let prevTopic=null;
  let spines=list.map((b,i)=>{
    const w=Math.max(24,Math.min(48,Math.round((+b.pages||250)/14)));const h=118+hash(b.title)%46;
    const cls=b.status==='read'?'':b.status==='reading'?'reading':'unread';
    const t=topicOf(b);const deco=t[0]!==prevTopic?`<div class="slot"><span class="bookend"><span class="tag">${esc(t[1])}</span>${decor(t[0])}</span></div>`:'';prevTopic=t[0];

function vCovers(){

/* small painted shelf with books and a plant/candles, for notebook page headers */
function shelfIllu(v){

    books+=`<rect x="${x}" y="${78-h}" width="${w}" height="${h}" rx="2" fill="${c}"/><rect x="${x}" y="${84-h}" width="${w}" height="2" fill="rgba(60,40,25,.2)"/>`;x+=w+1.5}
  return `<svg class="nb-illu" viewBox="0 0 190 86" aria-hidden="true">${books}<rect x="2" y="78" width="186" height="7" rx="2" fill="var(--wood)"/><g transform="translate(${x+2} 0) scale(.95)">${DECOR[v?2:0]}</g></svg>`;

/* genre colours for charts: fixed order, validated for colour-blind separation; text stays in ink tokens */
const GCOL=['#5E9A5A','#4C7FBE','#C8603F','#8D6BBF','#C9952B','#1E9E96'],GOTHER='#A8A39A';
const gName=b=>{const g=(b.genre||'').split(',')[0].trim();return g?g.charAt(0).toLocaleUpperCase('tr')+g.slice(1):'Türsüz'};
const chunk=(a,n)=>a.reduce((r,x,i)=>(i%n?r[r.length-1].push(x):r.push([x]),r),[]);
function vStats(){
  const y=S.year,R=readIn(y);
  const head=`<div class="head"><h2 class="hand">Yıl Özeti <small>${y}</small></h2></div>`;
  if(!R.length)return head+`<div class="empty">${decor(3)}<p>${y} yılında bitirilmiş kitap yok. Kitap bitirdikçe tür, puan ve ay grafiklerin burada oluşur.</p></div>`;
  const cnt={};R.forEach(b=>{const g=gName(b);cnt[g]=(cnt[g]||0)+1});
  const sorted=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||cmp(a[0],b[0]));
  const top=sorted.slice(0,sorted.length>6?5:6).map(e=>e[0]);
  const cat=b=>top.includes(gName(b))?gName(b):'Diğer';
  const cats=[...top];if(sorted.length>top.length)cats.push('Diğer');
  const col=c=>c==='Diğer'?GOTHER:GCOL[top.indexOf(c)];
  const ofCat=c=>R.filter(b=>cat(b)===c);
  const byCat=(a,b)=>cats.indexOf(cat(a))-cats.indexOf(cat(b))||cmp(a.endDate,b.endDate);
  const sq=b=>`<button class="sq" style="background:${col(cat(b))}" data-act="open" data-id="${b.id}" title="${esc(b.title)} · ${esc(gName(b))}${b.rating?' · '+String(b.rating).replace('.',',')+'★':''}"></button>`;
  /* pie of genres */
  const cx=90,cy=90,r=82;let a0=-Math.PI/2,lbl='';
  const pie=cats.map(c=>{const v=ofCat(c).length,a1=a0+v/R.length*2*Math.PI,mid=(a0+a1)/2;
    const d=v===R.length?`M${cx} ${cy-r}A${r} ${r} 0 1 1 ${cx-.01} ${cy-r}Z`:`M${cx} ${cy}L${(cx+r*Math.cos(a0)).toFixed(2)} ${(cy+r*Math.sin(a0)).toFixed(2)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)}Z`;
    if(v/R.length>=.07)lbl+=`<text x="${(cx+r*.64*Math.cos(mid)).toFixed(1)}" y="${(cy+r*.64*Math.sin(mid)).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${v}</text>`;
    a0=a1;return `<path d="${d}" fill="${col(c)}"><title>${esc(c)}: ${v} kitap</title></path>`}).join('');
  const legend=cats.map(c=>{const v=ofCat(c).length;return `<li><i style="background:${col(c)}"></i><span>${esc(c)}</span><b>${v}</b></li>`}).join('');
  /* average rating per genre */
  const avgOf=a=>{const x=a.filter(b=>+b.rating>0);return x.length?(x.reduce((s,b)=>s+ +b.rating,0)/x.length):null};
  const avgRows=cats.map(c=>{const v=avgOf(ofCat(c));return `<div class="avg-row"><span><i style="background:${col(c)}"></i>${esc(c)}</span><b>${v==null?'–':v.toFixed(1).replace('.',',')}</b></div>`}).join('');
  /* unit columns: books by star rating */
  const rated=R.filter(b=>+b.rating>0),unrated=R.length-rated.length;
  const starCols=[1,2,3,4,5].map(s=>{const L=rated.filter(b=>Math.floor(+b.rating)===s).sort(byCat);
    return `<div class="ucol"><span class="ucount">${L.length||''}</span><div class="ustack">${chunk(L,4).map(row=>`<div class="urow">${row.map(sq).join('')}</div>`).join('')}</div><span class="ulab">${s}★</span></div>`}).join('');
  const monCols=AYLAR.map((m,i)=>{const L=R.filter(b=>mOf(b.endDate)===i).sort(byCat);
    return `<div class="ucol"><span class="ucount">${L.length||''}</span><div class="ustack">${chunk(L,2).map(row=>`<div class="urow">${row.map(sq).join('')}</div>`).join('')}</div><span class="ulab sm">${m.slice(0,3)}</span></div>`}).join('');
  /* tiles */
  const withPages=R.filter(b=>+b.pages>0),pages=withPages.reduce((s,b)=>s+ +b.pages,0);
  const avg=avgOf(R);
  const au={};R.forEach(b=>{const k=(b.author||'').trim();if(k)au[k]=(au[k]||0)+1});
  const earlier=new Set(BOOKS().filter(b=>b.status==='read'&&yOf(b.endDate)<y).map(b=>(b.author||'').trim()));
  const newAu=Object.keys(au).filter(a=>!earlier.has(a)).length;
  const favs=Object.entries(au).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]||cmp(a[0],b[0])).slice(0,6);
  const tile=(k,v,n='')=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${n?`<div class="n">${n}</div>`:''}</div>`;
  return head+`<div class="st-hero"><div class="st-title">${y}<br>İSTATİSTİKLERİ</div>
    <div class="sticky taped" style="--tape:${PALETTE.sage}"><div><b>${avg==null?'–':avg.toFixed(1).replace('.',',')}</b><span>ortalama puan</span></div><div><b>${R.length}</b><span>toplam kitap</span></div></div></div>
  <div class="tiles">${tile('Okunan sayfa',pages?nf(pages):'–',withPages.length<R.length?`${R.length-withPages.length} kitabın sayfa bilgisi yok`:'')}${tile('Yazar',Object.keys(au).length,`${newAu} tanesi yeni tanıştığın yazar`)}${tile('Biçim',`<span class="fmts">${['print','ebook','audio'].map(f=>`<span title="${FORMATS[f]}">${ico(f)}${R.filter(b=>b.format===f).length}</span>`).join('')}</span>`)}${tile('En verimli ay',(()=>{const m=AYLAR.map((_,i)=>R.filter(b=>mOf(b.endDate)===i).length);const mx=Math.max(...m);return mx?AYLAR[m.indexOf(mx)]+' · '+mx:'–'})())}</div>
  <div class="st-grid">
    <section class="panel taped" style="--tape:${PALETTE.rose}"><h3 class="st-h">Türler</h3><div class="pie-wrap"><svg class="pie" viewBox="0 0 180 180" role="img" aria-label="Türlere göre kitap dağılımı">${pie}${lbl}</svg><ul class="lg">${legend}</ul></div>
      <h3 class="st-h" style="margin-top:16px">Türlere göre ortalama puan</h3><div class="avgbox">${avgRows}</div></section>
    <section class="panel taped" style="--tape:${PALETTE.sky}"><h3 class="st-h">Tür ve puan</h3><p class="note">Her kare bir kitap; rengi türünü gösterir. Kareye dokununca kitap açılır. 4,5 yıldız 4★ sütununda.</p>
      <div class="units">${starCols}</div>${unrated?`<p class="note">${unrated} kitap puansız.</p>`:''}
      <h3 class="st-h" style="margin-top:18px">Aylara göre</h3><div class="units months">${monCols}</div></section>
  </div>
  ${favs.length?`<section class="panel taped favs" style="--tape:${PALETTE.butter}"><h3 class="st-h">En çok okuduğun yazarlar</h3><ol>${favs.map(([a,n])=>`<li><span>${esc(a)}</span><b>${n} kitap</b></li>`).join('')}</ol></section>`:''}`;
}

/* ---------- challenge & stamps ---------- */
function bingoCard(y){
  let c=S.settings.bingo?.[y];
  if(!c||!Array.isArray(c.cells)||c.cells.length!==25){
    const r=rng(y*7919),pool=[...BINGO_POOL];for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    c={cells:Array.from({length:25},(_,i)=>i===12?{p:'SERBEST',b:null}:{p:pool[i>12?i-1:i],b:null})};
  }
  return c;
}
function bingoLines(cells){
  const on=i=>i===12||!!(cells[i].b&&BOOKS().some(x=>x.id===cells[i].b));const L=[];
  for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24],[4,8,12,16,20]);
  const done=L.filter(l=>l.every(on));
  return{done,cells:new Set(done.flat()),filled:cells.filter((_,i)=>on(i)).length};
}
function computeStamps(y){
  const R=readIn(y),pages=R.reduce((s,b)=>s+(+b.pages||0),0);
  const byM=Array.from({length:12},(_,m)=>R.filter(b=>mOf(b.endDate)===m));
  const mPages=byM.map(a=>a.reduce((s,b)=>s+(+b.pages||0),0));
  let run=0,best=0;byM.forEach(a=>{run=a.length?run+1:0;best=Math.max(best,run)});
  const fmt=f=>R.filter(b=>b.format===f).length;
  const genres=new Set(R.map(b=>(b.genre||'').trim().toLocaleLowerCase('tr')).filter(Boolean)).size;
  const au={};R.forEach(b=>{const k=(b.author||'').trim().toLocaleLowerCase('tr');if(k)au[k]=(au[k]||0)+1});
  const weekend=R.filter(b=>{if(!b.startDate)return false;const dw=new Date(b.startDate+'T12:00').getDay();if(![5,6,0].includes(dw))return false;const n=days(b.startDate,b.endDate);return n>=0&&n<=(7-dw)%7}).length;
  const bl=bingoLines(bingoCard(y).cells);
  const goal=goalOf(y);
  const B=(id,nm,ds,g,val,target)=>({id,nm,ds,g,val:Math.min(val,target),target,ok:val>=target});
  return{R,pages,byM,list:[
    B('first','İlk Sayfa','Yılın ilk kitabını bitir','seed',R.length,1),
    B('fast','Şimşek Okur','Bir kitabı 3 günde bitir','bolt',R.filter(b=>b.startDate&&days(b.startDate,b.endDate)<=3).length,1),
    B('weekend','Hafta Sonu Kaçamağı','Cuma–pazar arasında başla ve bitir','moon',weekend,1),
    B('brick','Tuğla','500+ sayfalık bir kitap bitir','brick',R.filter(b=>+b.pages>=500).length,1),
    B('short','Kısa ve Öz','150 sayfadan kısa bir kitap','thin',R.filter(b=>b.pages&&+b.pages<150).length,1),
    B('marathon','Ay Maratonu','Bir ayda 1.500 sayfa oku','calendar',Math.max(...mPages),1500),
    B('mountain','Sayfa Dağı','Yıl içinde 10.000 sayfa','mountain',pages,10000),
    B('streak','Seri Okur','Üst üste 3 ay kitap bitir','flame',best,3),
    B('audio','Kulak Misafiri','3 sesli kitap dinle','audio',fmt('audio'),3),
    B('ebook','Ekran Kurdu','3 e-kitap oku','ebook',fmt('ebook'),3),
    B('triple','Üç Yol','Basılı, e-kitap ve sesli: hepsinden bir tane','globe',['print','ebook','audio'].filter(f=>fmt(f)).length,3),
    B('classic','Zaman Yolcusu','1950’den önce yayımlanmış bir kitap','hourglass',R.filter(b=>b.year&&+b.year<1950).length,1),
    B('genres','Tür Kâşifi','5 farklı türde kitap','compass',genres,5),
    B('author','Yazar Sadakati','Aynı yazardan 3 kitap','person',Math.max(0,...Object.values(au)),3),
    B('five','Beş Yıldız','Bir kitaba tam puan ver','star',R.filter(b=>+b.rating===5).length,1),
    B('critic','Kalem Ustası','10 kitaba not yaz','pen',R.filter(b=>(b.review||'').trim().length>=15).length,10),
    B('shelf','Raf Temizliği','Kitaplığındaki 5 kitabı bitir','shelf',R.filter(b=>b.owned).length,5),
    B('tbr','Liste Avcısı','Okunacaklar listesinden 3 kitap bitir','check',R.filter(b=>b.fromTbr).length,3),
    B('m10','Kitap Kurdu','10 kitap bitir','stack',R.length,10),
    B('m25','Çeyrek Asır','25 kitap bitir','stack',R.length,25),
    B('m50','Elli Kitap','50 kitap bitir','stack',R.length,50),
    B('goal','Hedef Tamam','Yıllık hedefine ulaş','trophy',R.length,goal),
    B('bingo','Bingo!','Bingo kartında bir sıra tamamla','grid',bl.done.length,1),
    B('fullcard','Dolu Kart','Bingo kartının tamamını doldur','sparkle',bl.filled,25)
  ]};
}
function vStamps(){
  const y=S.year,{R,pages,byM,list}=computeStamps(y),goal=goalOf(y);
  const now=new Date(),cur=now.getFullYear()===y;
  const start=new Date(y,0,1),end=new Date(y+1,0,1),frac=cur?(now-start)/(end-start):(y<now.getFullYear()?1:0);
  const exp=goal*frac,diff=Math.round((R.length-exp)*10)/10;
  let pace='';
  if(R.length>=goal)pace=`<span class="pace ok">Hedefe ulaştın! ${R.length-goal>0?`Hedefin ${R.length-goal} kitap üstündesin.`:''}</span>`;
  else if(cur)pace=diff>=0?`<span class="pace ok">Yolundasın: plana göre ${diff>=1?Math.floor(diff)+' kitap öndesin.':'tam zamanında.'}</span>`:`<span class="pace behind">Plana göre ${Math.ceil(-diff)} kitap gerideyesin.</span>`;
  else if(y<now.getFullYear())pace=`<span class="muted">${y} hedefinin ${Math.round(R.length/goal*100)}%’i tamamlandı.</span>`;
  const left=cur?Math.ceil((end-now)/864e5):0;
  const rated=R.filter(b=>+b.rating>0),avg=rated.length?(rated.reduce((s,b)=>s+ +b.rating,0)/rated.length).toFixed(1):'–';
  const gc={};R.forEach(b=>{const g=(b.genre||'').trim();if(g)gc[g]=(gc[g]||0)+1});const topG=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0];
  const fc=f=>R.filter(b=>b.format===f).length;
  const earned=list.filter(s=>s.ok).length+byM.filter(a=>a.length).length;
  const stamp=(s,i)=>`<div class="stamp ${s.ok?'':'locked'}" style="--c:${PCOLS[(i*5)%PCOLS.length]}" title="${esc(s.ds)}"><div class="stamp-in">${ico(s.g,1.5)}<span class="nm">${esc(s.nm)}</span><span class="ds">${esc(s.ds)}</span><span class="pr">${s.ok?'Toplandı':`${nf(s.val)} / ${nf(s.target)}`}</span></div>${s.ok?`<span class="pm">${y}<br>PUL</span>`:''}</div>`;
  const mstamp=(a,m)=>`<div class="stamp mstamp ${a.length?'':'locked'}" style="--c:${PCOLS[m]}"><div class="stamp-in"><span class="mn">${AYLAR[m]}</span><span class="ds">Ay okuru</span><span class="pr">${a.length?a.length+' kitap':'—'}</span></div>${a.length?`<span class="pm">${AYLAR[m].slice(0,3).toUpperCase()}<br>${y}</span>`:''}</div>`;
  return `<div class="head"><h2 class="hand">Okuma Hedefi <small>${y}</small></h2><span class="muted">${earned} / ${list.length+12} pul toplandı</span></div>
  <div class="ch"><div class="panel taped goal-panel" style="--tape:${PALETTE.sage}">${decor(0)}
    <div class="goal-num">${R.length} <small>/ ${goal} kitap</small></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${R.length}"><i style="width:${Math.min(100,R.length/goal*100)}%"></i></div>
    <div>${pace}${cur?` <span class="muted">· ${left} gün kaldı</span>`:''}</div>
    <div class="goal-edit"><label for="goal-in">Yıllık hedef</label><input type="number" id="goal-in" min="1" max="999" value="${goal}"><span>kitap</span></div>
  </div><div class="panel stats taped" style="--tape:${PALETTE.rose}">
    <div class="stat"><div class="k">Okunan sayfa</div><div class="v">${nf(pages)}</div></div>
    <div class="stat"><div class="k">Ortalama puan</div><div class="v">${avg}${avg!=='–'?' <span class="stars" style="--r:'+avg+';font-size:.8rem">★★★★★</span>':''}</div></div>
    <div class="stat"><div class="k">Biçim</div><div class="fmts"><span title="Basılı">${ico('print')}${fc('print')}</span><span title="E-kitap">${ico('ebook')}${fc('ebook')}</span><span title="Sesli">${ico('audio')}${fc('audio')}</span></div></div>
    <div class="stat"><div class="k">En çok okunan tür</div><div class="v" style="font-size:1.1rem">${topG?esc(topG[0]):'–'}</div></div>
  </div></div>
  <section class="album taped" style="--tape:${PALETTE.butter}"><div class="sec-h"><h3>Ay Pulları</h3><span>Her ay en az bir kitap bitir</span></div>
  <div class="sgrid">${byM.map(mstamp).join('')}</div></section>
  <section class="album taped" style="--tape:${PALETTE.lilac}"><div class="sec-h"><h3>Başarı Pulları</h3><span>${list.filter(s=>s.ok).length} / ${list.length}</span></div>
  <div class="sgrid">${list.map(stamp).join('')}</div></section>`;
}

function vBingo(){
  const y=S.year,card=bingoCard(y),bl=bingoLines(card.cells);
  const cells=card.cells.map((c,i)=>{
    if(i===12)return `<button class="bcell free ${bl.cells.has(i)?'line':''}" data-act="bingo-cell" data-i="12">Serbest</button>`;
    const b=c.b&&BOOKS().find(x=>x.id===c.b);
    return `<button class="bcell ${b?'done':''} ${bl.cells.has(i)?'line':''}" style="--c:${b?esc(b.color||autoColor(b.title)):'transparent'}" data-act="bingo-cell" data-i="${i}">${esc(c.p)}${b?`<span class="bk">${esc(b.title)}</span>`:''}</button>`}).join('');
  return `<div class="head"><h2 class="hand">Kitap Bingo <small>${y}</small></h2><div class="chips"><button class="chip" data-act="bingo-shuffle">Boşları karıştır</button><button class="chip" data-act="bingo-reset">Kartı sıfırla</button></div></div>
  <div class="bingo-wrap taped" style="--tape:${PALETTE.rose}">${decor(1)}${decor(2)}<div class="bingo-title">Kitap <span>bingo</span></div><div class="bgrid">${cells}</div>
  <div class="bstat"><span>${bl.filled} / 25 kare · ${bl.done.length} bingo</span><span>Bir kareye dokun: okuduğun bir kitabı eşleştir ya da kareyi kendin yaz.</span></div></div>`;
}

function syncInputs(){document.querySelectorAll('#ed-form input[data-k],#ed-form textarea[data-k]').forEach(el=>{F[el.dataset.k]=el.value});const o=$('#f-owned');if(o)F.owned=o.checked}
function updatePrev(){const p=$('#ed-prev');if(p&&F)p.innerHTML=coverHTML({...F,color:F.color||autoColor(F.title||'x')})}

async function resizeImg(file,max,q){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return{blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q)),data:c.toDataURL('image/jpeg',q)}}
  finally{URL.revokeObjectURL(url)}
}

/* book search: Google Books first (good Turkish coverage), Open Library as fallback */
async function searchBooks(q){
  const out=[];
  try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=8&printType=books&q='+encodeURIComponent(q));const j=await r.json();
    for(const it of j.items||[]){const v=it.volumeInfo||{};const img=v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||'';
      out.push({title:v.title||'',author:(v.authors||[]).join(', '),pages:v.pageCount||'',year:+(v.publishedDate||'').slice(0,4)||'',cover:img?img.replace('http://','https://').replace('&edge=curl',''):'',about:(v.description||'').replace(/<[^>]+>/g,'').slice(0,260)})}}catch{}
  if(out.filter(x=>x.cover).length<2){try{const r=await fetch('https://openlibrary.org/search.json?limit=6&fields=title,author_name,number_of_pages_median,first_publish_year,cover_i&q='+encodeURIComponent(q));const j=await r.json();
    for(const d of j.docs||[])out.push({title:d.title||'',author:(d.author_name||[]).join(', '),pages:d.number_of_pages_median||'',year:d.first_publish_year||'',cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:'',about:''})}catch{}}
  return out.filter(x=>x.title).sort((a,b)=>!!b.cover-!!a.cover);
}
const norm=t=>String(t||'').toLocaleLowerCase('tr').replace(/[^a-z0-9çğıöşüâî]+/g,' ').trim();
const sameTitle=(a,b)=>{a=norm(a);b=norm(b);return!!a&&!!b&&(a===b||a.startsWith(b)||b.startsWith(a))};
async function fetchInfo(){
  syncInputs();const t=(F.title||'').trim();if(!t){toast('Önce kitabın adını yaz.');$('#f-title')?.focus();return}
  busy='Kitap aranıyor…';F._results=null;renderEditor();
  const res=await searchBooks(t+(F.author?' '+F.author:''));
  busy='';if(!F)return;F._results=res;renderEditor();
  if(!res.length)toast('Kitap bulunamadı; bilgileri elle doldurabilirsin.');
}
function applyResult(r,overwrite){
  const set=(k,v)=>{if(v!==''&&v!=null&&(overwrite||!F[k]))F[k]=v};
  set('author',r.author);set('pages',r.pages);set('year',r.year);set('about',r.about);
  if(r.cover&&(overwrite||!F.coverUrl))F.coverUrl=r.cover;
}
async function saveEditor(){
  syncInputs();const b=F;b.title=(b.title||'').trim();
  if(!b.title){toast('Kitap adı gerekli.');$('#f-title')?.focus();return}
  const t=todayISO();
  if(b.status==='read'&&!b.endDate)b.endDate=t;
  if(b.status==='reading'&&!b.startDate)b.startDate=t;
  if(b.endDate&&b.startDate>b.endDate)b.startDate=b.endDate;
  if(b._orig==='want'&&b.status!=='want')b.fromTbr=true;
  b.pages=b.pages?+b.pages:'';b.year=b.year?+b.year:'';b.seriesNo=b.seriesNo?+b.seriesNo:'';b.series=(b.series||'').trim();b.rating=+b.rating||0;
  if(!b.color)b.color=autoColor(b.title);
  if(b._photoBlob){b.coverData=b._small;delete b.coverUrl}
  const wasNew=b._new;closeSheet();await Store.saveBook(b);toast(wasNew?`“${b.title}” eklendi.`:'Kaydedildi.');
}

/* ---------- bulk fill: real covers and page counts from the book search ---------- */
const needsInfo=()=>S.books.filter(b=>!b.infoTried&&(!b.pages||(!b.coverUrl&&!b.coverData)));
function fillBanner(){
  if(!S.canEdit)return '';
  if(S.filling)return `<div class="banner"><span class="busy"><span class="spin"></span>Kapaklar ve sayfa sayıları aranıyor: ${S.filling.done} / ${S.filling.total} kitap</span></div>`;
  const n=needsInfo().length;if(!n)return '';
  return `<div class="banner"><span><b>${n} kitabın</b> kapağı ya da sayfa sayısı eksik. İnternetten bulup ekleyebilirim; yanlış eşleşen olursa kitabı açıp düzeltebilirsin.</span><button class="btn primary" data-act="fill-missing">${ico('sparkle')}Kapakları ve sayfaları getir</button></div>`;
}
async function fillMissing(){
  const M=needsInfo();if(!M.length||S.filling||!S.canEdit)return;
  S.filling={done:0,total:M.length};render();let found=0;
  for(const c of M){
    const b=S.books.find(x=>x.id===c.id);if(!b)continue;
    const res=(await searchBooks(b.title+' '+(b.author||''))).filter(r=>sameTitle(r.title,b.title));
    const u={...b,infoTried:true};
    const r=res.find(x=>x.cover)||res[0];
    if(r){if(!u.pages)u.pages=+(res.find(x=>x.pages)||{}).pages||'';if(!u.coverUrl&&!u.coverData&&r.cover)u.coverUrl=r.cover;if(!u.year&&r.year)u.year=+r.year;if(!u.about&&r.about)u.about=r.about;found++}
    const i=S.books.findIndex(x=>x.id===b.id);if(i>=0)S.books[i]=u;
    S.filling.done++;if(S.filling.done%5===0)render();
    await new Promise(z=>setTimeout(z,250));
  }
  S.filling=null;Store.schedule(`${found} kitabın kapağı/sayfa bilgisi eklendi`);render();
  toast(`${found} kitap için bilgi bulundu. Yanlış kapak varsa kitabı açıp “Fotoğrafı kaldır” ile silebilirsin.`);
}

    if(await GH.check(t)){ls.set(K.token,t);S.canEdit=!!S.me&&S.viewing===S.me;closeSheet();render();toast('Anahtar çalışıyor. Artık kitapların otomatik kaydedilecek.');openSetup()}
    else toast('Bu anahtar repoya yazamıyor. Contents: Read and write izni ve doğru repo seçili mi?');return}
  if(e.target.id==='tbr-form'){
    const inp=$('#tbr-in'),raw=inp.value.trim();if(!raw)return;
    const [title,author]=raw.split(/\s+[-–—]\s+/);
    const b={id:newId(),title:title.trim(),author:(author||'').trim(),status:'want',owned:false,format:'print',color:autoColor(title),addedAt:Date.now(),rating:0};
    inp.value='';await Store.saveBook(b);toast(`“${b.title}” okunacaklara eklendi.`);
    try{const res=(await searchBooks(b.title+' '+b.author)).filter(r=>sameTitle(r.title,b.title));const cur=S.books.find(x=>x.id===b.id);
      if(cur&&res.length){const r=res.find(x=>x.cover)||res[0];await Store.saveBook({...cur,author:cur.author||r.author,pages:cur.pages||+(res.find(x=>x.pages)||{}).pages||'',year:cur.year||r.year,coverUrl:r.cover||cur.coverUrl,about:cur.about||r.about})}}catch{}
  }
});

applyView();
Store.init();
</script>
